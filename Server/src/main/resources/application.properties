spring.application.name=backend

spring.config.import=optional:file:.env[.properties]

spring.data.mongodb.uri=${DB_URI:}

server.port=8080

# Online Compiler API
onlinecompiler.api.url=${ONLINE_COMPILER_API_URL:}
onlinecompiler.api.key=${ONLINE_COMPILER_API_KEY:}

# Gemini API
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:}

# Logging
logging.level.com.interviewplatform.backend.bot=INFO
logging.level.com.interviewplatform.backend.jwt=DEBUG
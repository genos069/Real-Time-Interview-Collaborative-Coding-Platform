spring.application.name=backend

# Load local environment variables from .env when running locally.
spring.config.import=optional:file:.env[.properties]

#MongoDB
spring.data.mongodb.uri=${MONGODB_URI}

server.port=${PORT:8080}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Question Dataset Seeding
app.seed.questions.enabled=${SEED_QUESTIONS_ENABLED:true}
 
# JWT Configuration
jwt.secret=${JWT_SECRET}

# Online Compiler API
onlinecompiler.api.url=${ONLINE_COMPILER_API_URL}
onlinecompiler.api.key=${ONLINE_COMPILER_API_KEY}

# Gemini API
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=${GEMINI_API_URL}

# Logging
logging.level.com.interviewplatform.backend=INFO
logging.level.com.interviewplatform.backend.bot=INFO
logging.level.com.interviewplatform.backend.jwt=INFO
logging.level.org.mongodb.driver=WARN
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.messaging=INFO

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
